name: Update README

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    name: Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write # push changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Update README
        run: bundle exec rake readme

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add README.md
            git commit -m 'Update README with recent posts'
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" HEAD
          fi
